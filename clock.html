<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        display: flex;
        flex-direction: column;
        align-items: center;

        border: 0;
        margin: 0;
        padding: 0;

        width: 100%;
        height: 100%;

        font-family: sans-serif;
        color: #aaaaaa;
        background: #202020;
      }

      div {
        border: 0;
        margin: 20px;
        padding: 0;

        flex-shrink: 0;
        flex-grow: 0;
      }

      div.time {
        font-size: 10em;
      }

      div.date {
        font-weight: bold;
      }

    </style>
    <title>Clock</title>
  </head>
  <body>
    <div class="time" id="currentTime"></div>
    <div class="date" id="currentDate"></div>
    <script>
      const timeElement = document.getElementById('currentTime');
      const dateElement = document.getElementById('currentDate');
      
      setInterval(function () {
        const currentDate = new Date();
        timeElement.innerText = currentDate.toLocaleTimeString("en-GB");
        dateElement.innerText = currentDate.toLocaleDateString("en-GB", {weekday: 'short', year: 'numeric', month: 'short', day: 'numeric'});
      }, 1000);
    </script>
  </body>
</html>
